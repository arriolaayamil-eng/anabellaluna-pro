# ═══════════════════════════════════════════════════════════════════════
#  nginx/agentdebug-staging.conf
#  AnabellaLuna Pro — Staging en agentdebug.online
#
#  Subdominios:
#    admin.agentdebug.online    → Admin ERP   (/var/www/anabellaluna-pro/admin/build)
#    agentes.agentdebug.online  → Agents CRM  (/var/www/anabellaluna-pro/agents/build)
#    frontend.agentdebug.online → Sitio Web   (/var/www/anabellaluna-pro/frontend/dist)
#
#  Instalación en el servidor:
#    sudo cp /var/www/anabellaluna-pro/nginx/agentdebug-staging.conf \
#            /etc/nginx/sites-available/agentdebug-staging
#    sudo ln -s /etc/nginx/sites-available/agentdebug-staging \
#               /etc/nginx/sites-enabled/agentdebug-staging
#    sudo nginx -t && sudo systemctl reload nginx
#
#  SSL (después de que el DNS propague):
#    sudo certbot --nginx -d admin.agentdebug.online \
#                         -d agentes.agentdebug.online \
#                         -d frontend.agentdebug.online
# ═══════════════════════════════════════════════════════════════════════

# ── Macro para proxy al backend (puerto 4000) ─────────────────────────
# Evita repetir el bloque de headers en cada location.
# Se reutiliza en los 3 server blocks.

# ─────────────────────────────────────────────────────────────────────
#  1. ADMIN ERP  →  admin.agentdebug.online
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.agentdebug.online;

    root /var/www/anabellaluna-pro/admin/build;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/json application/javascript text/xml application/xml text/plain;
    gzip_min_length 1024;

    # Backend API — proxied al mismo servidor
    location /auth/ {
        proxy_pass http://127.0.0.1:4000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /crm/ {
        proxy_pass http://127.0.0.1:4000/crm/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /public/ {
        proxy_pass http://127.0.0.1:4000/public/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /documents/ {
        proxy_pass http://127.0.0.1:4000/documents/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA — todo lo que no es API va al index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Assets estáticos con caché larga (CRA genera hashes en nombres)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

