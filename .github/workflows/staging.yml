name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: SSH Deploy → agentdebug.online
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e
            echo "=== Deploy iniciado: $(date) ==="

            # Clonar repo si no existe
            if [ ! -d /var/www/anabellaluna-pro ]; then
              echo "Clonando repo por primera vez..."
              git clone https://github.com/arriolaayamil-eng/anabellaluna-pro.git /var/www/anabellaluna-pro
            fi

            # Ejecutar script de deploy
            bash /var/www/anabellaluna-pro/scripts/deploy-staging.sh

            echo "=== Deploy completado: $(date) ==="
